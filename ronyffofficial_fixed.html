<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RONY FF OFFICIAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--cyan:#08d8ee;--bg:#030507;--card:#0b1018;--line:#0d7f8b;--muted:#87909d}
body{font-family:Arial,Helvetica,sans-serif;background:#000;color:#fff;min-height:100vh}
button,input{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
#loading-screen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999}
.loading-card{width:min(90%,380px);padding:38px 28px;text-align:center;background:#0b1018;border:1px solid #15323a;border-radius:20px;box-shadow:0 0 35px #00d9ff18}
.loading-card h2{font-size:16px;letter-spacing:3px;color:var(--cyan);margin-bottom:26px}
.spinner{width:58px;height:58px;border:4px solid #18232b;border-top-color:var(--cyan);border-radius:50%;margin:auto auto 24px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#8b949e;font:13px monospace;letter-spacing:1px}
.progress{height:4px;background:#172029;border-radius:5px;margin-top:20px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation:load 2.8s ease forwards}
@keyframes load{from{width:0}to{width:100%}}
#auth-view{min-height:100vh;padding:42px 12px 28px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#auth-view:before,#auth-view:after{content:"";position:absolute;width:45px;height:45px;border-radius:50%;background:var(--cyan);filter:blur(2px);opacity:.9}
#auth-view:before{left:-18px;top:43%}.auth-orb{right:-18px;bottom:12%}
.login-card{width:min(94%,596px);background:#0b1018;border:1px solid #126d76;border-radius:30px;padding:44px 34px 42px;text-align:center;position:relative;z-index:2;box-shadow:0 0 35px #00d9ff20}
.profile-container{width:96px;height:96px;margin:0 auto 24px;padding:4px;border-radius:50%;border:3px solid var(--cyan);box-shadow:0 0 24px #00e5ff77}
.profile-img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;background:#fff}
.title{font-size:29px;font-weight:800;letter-spacing:1px}
.subtitle{color:var(--cyan);letter-spacing:4px;font-size:15px;margin:10px 0 28px}
.input-group{margin:0 0 16px}.input-group input{width:100%;height:76px;border-radius:16px;border:1px solid #26303a;background:#000;color:#fff;text-align:center;font-size:19px;outline:none}.input-group input:focus{border-color:var(--cyan);box-shadow:0 0 14px #00e5ff22}
.btn-login,.btn-google,.btn-community,.btn-buy{width:100%;height:72px;border-radius:16px;font-weight:800;font-size:18px;border:0}
.btn-login{background:var(--cyan);color:#001015;box-shadow:0 0 20px #00e5ff66;margin:4px 0 22px}
.or{color:#646b73;margin:0 0 14px;font-size:14px}
.btn-google{background:#fff;color:#222;display:flex;align-items:center;justify-content:center;gap:14px}.btn-google svg{width:28px;height:28px}
.community-label{margin:22px 0 12px;color:#666}.btn-community{background:transparent;border:1px solid var(--cyan);color:var(--cyan);height:64px;text-decoration:none;display:flex;align-items:center;justify-content:center}
.footer-links{display:flex;justify-content:center;gap:28px;margin:22px 0 0;font-size:14px}.footer-links a{color:var(--cyan);text-decoration:none}
.copyright{margin-top:22px;color:#4c545d;font-size:12px}
.status{min-height:20px;margin:10px 0;color:#ff7180;font-size:13px}

#app-view{min-height:100vh;background:#06080c}
.topbar{height:64px;background:#0a0d12;border-bottom:1px solid #1a232c;display:flex;align-items:center;gap:12px;padding:0 14px;position:sticky;top:0;z-index:50}
.brand-mini{font-weight:800;letter-spacing:.5px;flex:1}.menu-btn,.icon-btn{background:#10151c;border:1px solid #27313b;color:#fff;border-radius:12px;width:42px;height:42px}.avatar-mini{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan)}
.layout{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:250px;background:#090c11;border-right:1px solid #1b232c;padding:16px 12px;position:fixed;top:64px;bottom:0;left:0;z-index:40;overflow:auto}
.sidebar a,.sidebar button{width:100%;text-align:left;padding:14px;border:0;background:transparent;color:#b7bec7;border-radius:11px;margin-bottom:4px}.sidebar a:hover,.sidebar button:hover,.sidebar .active{background:#102027;color:var(--cyan)}
.main{margin-left:250px;width:calc(100% - 250px);padding:22px;max-width:1300px}
.hero{background:linear-gradient(145deg,#0b131a,#080b10);border:1px solid #18343c;border-radius:18px;padding:22px;margin-bottom:18px}
.hero h1{font-size:28px;margin-bottom:8px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#0b1016;border:1px solid #1a2730;border-radius:16px;padding:18px}.stat{font-size:26px;font-weight:800;color:var(--cyan);margin-top:8px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.action{background:#0c151b;border:1px solid #1a7781;color:#fff;border-radius:14px;padding:16px;text-align:center}.action b{display:block;color:var(--cyan);margin-bottom:5px}
.section-title{font-size:20px;margin:22px 0 12px}.list{display:grid;gap:10px}.row{background:#0b1016;border:1px solid #1a2730;border-radius:13px;padding:15px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.primary{background:var(--cyan);color:#001015;border:0;border-radius:10px;padding:10px 15px;font-weight:800}.danger{background:#32131a;color:#ff8a98;border:1px solid #68202e;border-radius:10px;padding:10px}
.notice{border-left:3px solid var(--cyan);padding:13px 15px;background:#07151a;border-radius:8px;color:#b8dfe4}
#drawerBackdrop{display:none;position:fixed;inset:0;background:#0009;z-index:35}
@media(max-width:800px){.sidebar{transform:translateX(-105%);transition:.2s}.sidebar.open{transform:none}#drawerBackdrop.open{display:block}.main{margin-left:0;width:100%;padding:14px}.grid{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:repeat(2,1fr)}.login-card{padding:35px 20px}.title{font-size:23px}.input-group input{height:62px;font-size:16px}.btn-login,.btn-google{height:62px}.profile-container{width:84px;height:84px}}
@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:23px}.row{align-items:flex-start;flex-direction:column}.footer-links{gap:14px}}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loading-card">
    <h2>SECURITY VALIDATION</h2>
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Syncing security keys...</div>
    <div class="progress"><i></i></div>
  </div>
</div>

<section id="auth-view" class="hidden">
  <span class="auth-orb"></span>
  <div class="login-card">
    <div class="profile-container">
      <img class="profile-img" src="photo.jpg" alt="RONY FF OFFICIAL">
    </div>
    <div class="title">👑 RONY FF OFFICIAL 👑</div>
    <div class="subtitle">AUTHORIZE ACCESS</div>

    <form id="login-form">
      <div class="input-group"><input id="username" type="text" placeholder="USER NAME / EMAIL" autocomplete="username" required></div>
      <div class="input-group"><input id="password" type="password" placeholder="PASSWORD" autocomplete="current-password" required></div>
      <button class="btn-login" type="submit">LOGIN NOW</button>

    <button id="google-login-btn" class="btn-google" type="button">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.24 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 10.03 0 12s.43 3.58 1.19 5.12l4.09-2.55z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      SIGN IN WITH GOOGLE
    </button>

    <div class="community-label">OR JOIN COMMUNITY</div>
    <a class="btn-community" href="https://t.me/+nHiJgdSXQ8VjZjA9" target="_blank" rel="noopener">▶ JOIN TELEGRAM CHANNEL</a>

    <div class="footer-links">
      <a href="#" id="forgot-link">Forgot Password?</a>
      <a href="#" id="change-link">Change Gmail</a>
      <a href="#" id="create-link">Create Account</a>
    </div>
    <div class="status" id="auth-status"></div>
    <div class="copyright">© 2026 RONY FF OFFICIAL SYSTEM</div>
  </div>
</section>

<section id="app-view" class="hidden">
  <header class="topbar">
    <button class="menu-btn" id="menu-btn">☰</button>
    <div class="brand-mini">👑 RONY FF OFFICIAL</div>
    <a class="icon-btn" href="https://t.me/+nHiJgdSXQ8VjZjA9" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;text-decoration:none">✈</a>
    <img id="avatar-mini" class="avatar-mini" src="photo.jpg" alt="">
  </header>
  <div id="drawerBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <button class="active" data-page="dashboard">⌂ Dashboard</button>
    <button data-page="deposit">＋ Deposit</button>
    <button data-page="products">🛒 Buy Keys</button>

    <button data-page="history">◷ History</button>

  </aside>
  <main class="main" id="main-content"></main>
</section>

<script>
const SUPABASE_URL='https://dgknhptbbozshyfiyobo.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_NEHCtr3Y0o8FctOz5Jm59A_P4GhFAQd';
const REDIRECT_URL='https://ronyffofficial590-source.github.io/ronyffofficial/';
const TELEGRAM_URL='https://t.me/+nHiJgdSXQ8VjZjA9';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let currentUser=null,currentProfile=null;

const $=id=>document.getElementById(id);
function setLoadingText(t){$('loading-text').textContent=t}
function hideLoading(){const x=$('loading-screen');x.style.opacity='0';setTimeout(()=>x.remove(),350)}
function showAuth(){ $('auth-view').classList.remove('hidden'); $('app-view').classList.add('hidden'); }
function showApp(){ $('auth-view').classList.add('hidden'); $('app-view').classList.remove('hidden'); }
function msg(t){$('auth-status').textContent=t}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

async function ensureProfile(user){
  const email=user.email||'';
  let {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(error) throw error;
  if(!p){
    const base=(user.user_metadata?.username||user.user_metadata?.name||email.split('@')[0]||'user').slice(0,50);
    const r=await sb.from('profiles').insert({id:user.id,username:base,email}).select().single();
    if(r.error) throw r.error;p=r.data;
  }
  currentProfile=p;
  // Wallet is read-only from the browser; balance changes must be server-side.
  return p;
}

async function boot(){
  try{
    setLoadingText('Checking secure session...');
    const {data:{session},error}=await sb.auth.getSession();
    if(error) throw error;
    if(session){
      currentUser=session.user;
      setLoadingText('Loading your account...');
      try{await ensureProfile(currentUser)}catch(e){console.error(e); /* still allow the app shell */ }
      showApp(); await navigate('dashboard');
    }else showAuth();
  }catch(e){
    console.error(e);showAuth();msg(e.message||'Unable to load account.');
  }finally{setTimeout(hideLoading,350)}
}

async function loginNormal(identifier,password){
  let email=identifier.trim();
  if(!email.includes('@')){
    const r=await sb.from('profiles').select('email').eq('username',email).maybeSingle();
    if(r.error) throw r.error;
    if(!r.data?.email) throw new Error('Username not found.');
    email=r.data.email;
  }
  const r=await sb.auth.signInWithPassword({email,password});
  if(r.error) throw r.error;
}
$('login-form').addEventListener('submit',async e=>{
  e.preventDefault();msg('');
  const b=e.currentTarget.querySelector('button');b.disabled=true;b.textContent='CHECKING...';
  try{await loginNormal($('username').value,$('password').value)}catch(e){msg(e.message)}finally{b.disabled=false;b.textContent='LOGIN NOW'}
});

$('google-login-btn').onclick=async()=>{
  msg('');
  const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:REDIRECT_URL}});
  if(r.error) msg(r.error.message);
};

$('create-link').onclick=async e=>{
  e.preventDefault();
  const email=prompt('Enter your Gmail/email:');if(!email)return;
  const password=prompt('Create a password (minimum 6 characters):');if(!password)return;
  const username=prompt('Choose a username:');if(!username)return;
  const r=await sb.auth.signUp({email,password,options:{data:{username}}});
  if(r.error){msg(r.error.message);return}
  if(r.data.user){
    const p=await sb.from('profiles').upsert({id:r.data.user.id,email,username},{onConflict:'id'});
    if(p.error) console.warn(p.error);
  }
  msg(r.data.session?'Account created.':'Account created. Check your email if confirmation is enabled.');
};

$('forgot-link').onclick=async e=>{
  e.preventDefault();const email=prompt('Enter your account email:');if(!email)return;
  const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:REDIRECT_URL});
  msg(r.error?r.error.message:'Password reset email sent.');
};
$('change-link').onclick=async e=>{
  e.preventDefault();const email=prompt('Enter the new Gmail/email:');if(!email)return;
  const r=await sb.auth.updateUser({email});
  msg(r.error?r.error.message:'Email change request sent. Check the new email.');
};

async function q(table,columns='*',opts={}){
  try{
    let x=sb.from(table).select(columns); if(opts.eq)x=x.eq(opts.eq[0],opts.eq[1]); if(opts.limit)x=x.limit(opts.limit);
    const r=await x; return r.error?[]:(r.data||[]);
  }catch{return []}
}
async function renderDashboard(){
  let wallet=await q('wallets','balance',{eq:['user_id',currentUser.id]});
  const balance=Number(wallet[0]?.balance||0).toFixed(2);
  let purchases=await q('purchases','id',{eq:['user_id',currentUser.id]});
  let deposits=await q('deposits','id',{eq:['user_id',currentUser.id]});
  $('main-content').innerHTML=`
  <div class="hero"><h1>Welcome, ${esc(currentProfile?.username||currentUser.email?.split('@')[0]||'User')} 👋</h1><p class="muted">RONY FF OFFICIAL secure dashboard</p></div>
  <div class="grid">
    <div class="card"><div class="muted">Wallet Balance</div><div class="stat">₹ ${balance}</div></div>
    <div class="card"><div class="muted">My Keys</div><div class="stat">${purchases.length}</div></div>
    <div class="card"><div class="muted">Deposits</div><div class="stat">${deposits.length}</div></div>
    <div class="card"><div class="muted">Account</div><div class="stat">${currentProfile?.is_reseller?'RESELLER':'USER'}</div></div>
  </div>
  <div class="actions">
    <button class="action" data-page="deposit"><b>＋ DEPOSIT</b>Add wallet balance</button>
    <button class="action" data-page="products"><b>🔑 BUY KEYS</b>View products</button>
    <button class="action" data-page="keys"><b>📋 MY KEYS</b>View purchases</button>
    <button class="action" data-page="support"><b>🎫 SUPPORT</b>Create ticket</button>
  </div>
  <div class="section-title">System Notice</div><div class="notice">Use the official Telegram channel for updates and support. Wallet balance and purchase approval are handled by the secure backend.</div>`;
  bindPageButtons();
}
async function renderDeposit(){
  $('main-content').innerHTML=`<div class="hero"><h1>Deposit</h1><p class="muted">Choose a payment method and submit your deposit.</p></div>
  <div class="grid">
    <div class="card"><h3>UPI</h3><p class="muted">Use your configured UPI QR/payment details.</p><button class="primary" onclick="alert('Add your UPI QR image as upi.jpg and connect your deposit form here.')">OPEN UPI</button></div>
    <div class="card"><h3>Binance / USDT</h3><p class="muted">Use your configured Binance payment details.</p><button class="primary" onclick="alert('Add your Binance QR image as binance.jpg and connect your deposit form here.')">OPEN BINANCE</button></div>
    <div class="card"><h3>bKash / Nagad</h3><p class="muted">Use your configured payment details.</p><button class="primary" onclick="alert('Add your payment image as bkash.jpg and connect your deposit form here.')">OPEN PAYMENT</button></div>
    <div class="card"><h3>Support</h3><p class="muted">Need help with a deposit?</p><a class="primary" style="display:inline-block;text-decoration:none" href="${TELEGRAM_URL}" target="_blank">TELEGRAM</a></div>
  </div>`;
}
async function renderProducts(){
  const products=await q('products','*',{});
  $('main-content').innerHTML=`<div class="hero"><h1>Buy Keys</h1><p class="muted">Available products</p></div><div class="list">${products.length?products.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.description||'')} • ${p.duration_days||1} days</div></div><div><b style="color:var(--cyan)">₹ ${Number(currentProfile?.is_reseller?p.reseller_price:p.user_price||0).toFixed(2)}</b> <button class="primary" onclick="buyProduct(${Number(p.id)})">BUY</button></div></div>`).join(''):`<div class="card">No products have been added yet.</div>`}</div>`;
}
async function buyProduct(id){
  if(!confirm('Confirm purchase? Wallet deduction is server-side.'))return;
  const r=await sb.rpc('purchase_product',{p_product_id:id});
  if(r.error)alert(r.error.message);else{alert('Purchase successful.');navigate('keys')}
}
async function renderKeys(){
 const rows=await q('purchases','*',{eq:['user_id',currentUser.id]});
 $('main-content').innerHTML=`<div class="hero"><h1>My Keys</h1></div><div class="list">${rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.key_value||'KEY')}</b><div class="muted">${esc(x.status||'active')}</div></div><button class="primary" onclick="navigator.clipboard?.writeText(${JSON.stringify(x.key_value||'')})">COPY</button></div>`).join(''):`<div class="card">No keys purchased yet.</div>`}</div>`;
}
async function renderHistory(){
 const rows=await q('deposits','*',{eq:['user_id',currentUser.id]});
 $('main-content').innerHTML=`<div class="hero"><h1>History</h1></div><div class="list">${rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.method||'Deposit')}</b><div class="muted">${esc(x.created_at||'')}</div></div><span>${esc(x.status||'pending')} • ₹${esc(x.amount||0)}</span></div>`).join(''):`<div class="card">No history yet.</div>`}</div>`;
}
async function renderResellers(){ $('main-content').innerHTML=`<div class="hero"><h1>My Resellers</h1><p class="muted">Reseller status and requests.</p></div><div class="card"><b>Status:</b> ${currentProfile?.is_reseller?'Approved Reseller':'Regular User'}<br><br><button class="primary" onclick="requestReseller()">REQUEST RESELLER</button></div>`}
async function requestReseller(){const r=await sb.from('reseller_requests').insert({user_id:currentUser.id,status:'pending'});alert(r.error?r.error.message:'Reseller request submitted.');}
async function renderSupport(){ $('main-content').innerHTML=`<div class="hero"><h1>Support Ticket</h1></div><div class="card"><input id="ticket-subject" placeholder="Subject" style="width:100%;padding:14px;background:#000;color:#fff;border:1px solid #27313b;border-radius:10px;margin-bottom:10px"><textarea id="ticket-message" placeholder="Message" style="width:100%;height:150px;padding:14px;background:#000;color:#fff;border:1px solid #27313b;border-radius:10px"></textarea><br><br><button class="primary" onclick="createTicket()">SUBMIT TICKET</button></div>`}
async function createTicket(){const subject=$('ticket-subject').value.trim(),message=$('ticket-message').value.trim();if(!subject||!message)return alert('Enter subject and message.');const r=await sb.from('support_tickets').insert({user_id:currentUser.id,subject,message});alert(r.error?r.error.message:'Ticket submitted.');}
async function renderRefer(){ $('main-content').innerHTML=`<div class="hero"><h1>Refer And Earn Money</h1><p class="muted">Share your referral link.</p></div><div class="card"><input id="ref" readonly value="${location.origin+location.pathname+'?ref='+encodeURIComponent(currentUser.id)}" style="width:100%;padding:13px;background:#000;color:#fff;border:1px solid #27313b;border-radius:10px"><br><br><button class="primary" onclick="navigator.clipboard?.writeText($('ref').value);alert('Copied')">COPY LINK</button></div>`}
async function renderProfile(){ $('main-content').innerHTML=`<div class="hero"><h1>Profile</h1></div><div class="card"><p><b>Email:</b> ${esc(currentUser.email)}</p><p style="margin-top:10px"><b>Username:</b> ${esc(currentProfile?.username||'')}</p><p style="margin-top:10px"><b>Role:</b> ${currentProfile?.is_reseller?'Reseller':'User'}</p></div>`}
async function navigate(page){
 document.querySelectorAll('.sidebar [data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
 if(page==='dashboard')return renderDashboard();
 if(page==='deposit')return renderDeposit();
 if(page==='products')return renderProducts();
 if(page==='keys')return renderKeys();
 if(page==='history')return renderHistory();
 if(page==='resellers')return renderResellers();
 if(page==='support')return renderSupport();
 if(page==='refer')return renderRefer();
 if(page==='profile')return renderProfile();
}
function bindPageButtons(){document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>{navigate(x.dataset.page);if(innerWidth<=800){ $('sidebar').classList.remove('open');$('drawerBackdrop').classList.remove('open')}})}
bindPageButtons();
$('menu-btn').onclick=()=>{$('sidebar').classList.toggle('open');$('drawerBackdrop').classList.toggle('open')}
$('drawerBackdrop').onclick=()=>{$('sidebar').classList.remove('open');$('drawerBackdrop').classList.remove('open')}
$('logout-btn').onclick=async()=>{await sb.auth.signOut();location.href=REDIRECT_URL}
sb.auth.onAuthStateChange(async(_event,session)=>{if(session&&!currentUser){currentUser=session.user;try{await ensureProfile(currentUser)}catch{}showApp();await navigate('dashboard')}else if(!session){currentUser=null;currentProfile=null;showAuth()}});
boot();
</script>
</body>
