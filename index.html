<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONY FF OFFICIAL - Admin Panel</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #050505;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px 0;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity .5s ease;
        }

        .loading-card {
            background: #0d1117;
            border: 1px solid #161b22;
            border-radius: 16px;
            padding: 40px 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,229,255,.1);
        }

        .loading-card h2 {
            color: #00e5ff;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid #161b22;
            border-top-color: #00e5ff;
            border-radius: 50%;
            margin: 0 auto 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #8b949e;
            font-size: .9rem;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-family: monospace;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #161b22;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0;
            height: 100%;
            background: #00e5ff;
            box-shadow: 0 0 10px #00e5ff;
            animation: fillProgress 3s forwards;
        }

        @keyframes fillProgress {
            0% { width: 0; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        .login-card {
            background: #0d1117;
            border: 1px solid #161b22;
            border-radius: 20px;
            padding: 30px 25px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0,229,255,.15);
        }

        .profile-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00e5ff;
            box-shadow: 0 0 15px rgba(0,229,255,.4);
        }

        .title {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #00e5ff;
            font-size: .75rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #050505;
            border: 1px solid #21262d;
            border-radius: 8px;
            color: #fff;
            font-size: .85rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: #00e5ff;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #00e5ff;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            font-size: .9rem;
            letter-spacing: 1px;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0,229,255,.3);
        }

        .btn-login:disabled {
            opacity: .6;
        }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background: #fff;
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 600;
            font-size: .85rem;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .btn-google:hover {
            background: #f1f1f1;
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
        }

        .divider {
            color: #484f58;
            font-size: .75rem;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .btn-telegram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #00e5ff;
            border-radius: 8px;
            color: #00e5ff;
            text-decoration: none;
            font-size: .85rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .btn-telegram:hover {
            background: rgba(0,229,255,.1);
        }

        .how-to {
            display: block;
            color: #00e5ff;
            text-decoration: none;
            font-size: .78rem;
            font-weight: 600;
            margin: 5px 0 15px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: .75rem;
        }

        .footer-links a {
            color: #00e5ff;
            text-decoration: none;
            cursor: pointer;
        }

        .copyright {
            margin-top: 15px;
            color: #484f58;
            font-size: .7rem;
        }

        #message {
            display: none;
            margin: 0 0 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: .78rem;
            line-height: 1.4;
        }

        #message.error {
            display: block;
            color: #ff6b6b;
            background: rgba(255,0,0,.08);
            border: 1px solid rgba(255,0,0,.2);
        }

        #message.success {
            display: block;
            color: #00e5a0;
            background: rgba(0,229,160,.08);
            border: 1px solid rgba(0,229,160,.2);
        }
    </style>
</head>

<body>

    <!-- LOADING -->
    <div id="loading-screen">
        <div class="loading-card">
            <h2>SECURITY VALIDATION</h2>

            <div class="spinner"></div>

            <div class="loading-text">
                Syncing security keys...
            </div>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>


    <!-- LOGIN -->
    <div class="login-card">

        <div class="profile-container">
            <img
                src="photo.jpg"
                alt="Profile"
                class="profile-img"
            >
        </div>

        <div class="title">
            👑 RONY FF OFFICIAL 👑
        </div>

        <div class="subtitle">
            AUTHORIZE ACCESS
        </div>


        <div id="message"></div>


        <!-- NORMAL LOGIN -->
        <form id="login-form">

            <div class="input-group">
                <input
                    type="email"
                    id="username"
                    placeholder="EMAIL ADDRESS"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <input
                    type="password"
                    id="password"
                    placeholder="PASSWORD"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn-login"
                id="login-btn"
            >
                LOGIN NOW
            </button>

        </form>


        <!-- REAL GOOGLE LOGIN -->
        <button
            type="button"
            id="google-login-btn"
            class="btn-google"
        >

            <svg viewBox="0 0 24 24">
                <path
                    fill="#4285F4"
                    d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"
                />

                <path
                    fill="#34A853"
                    d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.24 24 12 24z"
                />

                <path
                    fill="#FBBC05"
                    d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 11.7s.43 3.58 1.19 5.12l4.09-2.55z"
                />

                <path
                    fill="#EA4335"
                    d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"
                />
            </svg>

            SIGN IN WITH GOOGLE

        </button>


        <div class="divider">
            OR JOIN COMMUNITY
        </div>


        <!-- TELEGRAM -->
        <a
            href="https://t.me/+nHiJgdSXQ8VjZjA9"
            target="_blank"
            rel="noopener noreferrer"
            class="btn-telegram"
        >
            JOIN TELEGRAM CHANNEL
        </a>


        <!-- HOW TO BUY / USE -->
        <a
            href="https://t.me/+nHiJgdSXQ8VjZjA9"
            target="_blank"
            rel="noopener noreferrer"
            class="how-to"
        >
            HOW TO BUY AND HOW TO USE
        </a>


        <div class="footer-links">

            <a
                href="#"
                id="forgot-password"
            >
                Forgot Password?
            </a>

            <a
                href="#"
                id="create-account"
            >
                Create Account
            </a>

        </div>


        <div class="copyright">
            © 2026 RONY FF OFFICIAL SYSTEM
        </div>

    </div>


    <script>

        // =========================================
        // NEW SUPABASE CONFIGURATION
        // =========================================

        const SUPABASE_URL =
            'https://dgknhptbbozshyfiyobo.supabase.co';

        const SUPABASE_PUBLISHABLE_KEY =
            'sb_publishable_NEHCtr3Y0o8FctOz5Jm59A_P4GhFAQd';

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // =========================================
        // TELEGRAM
        // =========================================

        const TELEGRAM_URL =
            'https://t.me/+nHiJgdSXQ8VjZjA9';


        // =========================================
        // LOADING SCREEN
        // =========================================

        window.addEventListener('load', () => {

            setTimeout(() => {

                const screen =
                    document.getElementById('loading-screen');

                screen.style.opacity = '0';

                setTimeout(() => {
                    screen.style.display = 'none';
                }, 500);

            }, 3000);

        });


        // =========================================
        // MESSAGE
        // =========================================

        function showMessage(text, type = 'error') {

            const message =
                document.getElementById('message');

            message.textContent = text;

            message.className = type;

        }


        function clearMessage() {

            const message =
                document.getElementById('message');

            message.textContent = '';

            message.className = '';

        }


        // =========================================
        // REAL GOOGLE LOGIN
        // =========================================

        document
            .getElementById('google-login-btn')
            .addEventListener('click', async () => {

                clearMessage();

                const button =
                    document.getElementById('google-login-btn');

                button.disabled = true;

                button.innerHTML =
                    'CONNECTING TO GOOGLE...';

                try {

                    const { error } =
                        await supabaseClient.auth
                            .signInWithOAuth({

                                provider: 'google',

                                options: {

                                    redirectTo:
                                        window.location.origin

                                }

                            });


                    if (error) {

                        console.error(
                            'Google Login Error:',
                            error
                        );

                        showMessage(
                            error.message,
                            'error'
                        );

                        button.disabled = false;

                        button.innerHTML =
                            'SIGN IN WITH GOOGLE';

                    }

                } catch (error) {

                    console.error(error);

                    showMessage(
                        'Unable to start Google Sign-In.',
                        'error'
                    );

                    button.disabled = false;

                    button.innerHTML =
                        'SIGN IN WITH GOOGLE';

                }

            });


        // =========================================
        // NORMAL EMAIL/PASSWORD LOGIN
        // =========================================

        document
            .getElementById('login-form')
            .addEventListener('submit', async (event) => {

                event.preventDefault();

                clearMessage();

                const email =
                    document.getElementById('username')
                        .value
                        .trim();

                const password =
                    document.getElementById('password')
                        .value;

                const button =
                    document.getElementById('login-btn');

                button.disabled = true;

                button.textContent =
                    'LOGGING IN...';


                try {

                    const { data, error } =
                        await supabaseClient.auth
                            .signInWithPassword({

                                email: email,

                                password: password

                            });


                    if (error) {

                        showMessage(
                            error.message,
                            'error'
                        );

                        button.disabled = false;

                        button.textContent =
                            'LOGIN NOW';

                        return;

                    }


                    showMessage(
                        'Login successful.',
                        'success'
                    );

                    console.log(
                        'Logged in user:',
                        data.user
                    );


                    /*
                     * आगे आपका Dashboard URL
                     * यहाँ लगाया जाएगा।
                     *
                     * उदाहरण:
                     *
                     * window.location.href =
                     *     'dashboard.html';
                     */


                } catch (error) {

                    console.error(error);

                    showMessage(
                        'An unexpected error occurred.',
                        'error'
                    );

                    button.disabled = false;

                    button.textContent =
                        'LOGIN NOW';

                }

            });


        // =========================================
        // AUTH STATE
        // =========================================

        supabaseClient.auth
            .onAuthStateChange(
                (event, session) => {

                    console.log(
                        'Auth Event:',
                        event
                    );

                    if (session) {

                        console.log(
                            'Authenticated:',
                            session.user
                        );

                    }

                }
            );


        // =========================================
        // FORGOT PASSWORD
        // =========================================

        document
            .getElementById('forgot-password')
            .addEventListener('click', (event) => {

                event.preventDefault();

                window.location.href =
                    'forgot-password.html';

            });


        // =========================================
        // CREATE ACCOUNT
        // =========================================

        document
            .getElementById('create-account')
            .addEventListener('click', (event) => {

                event.preventDefault();

                window.location.href =
                    'register.html';

            });

    </script>

</body>
</html>
