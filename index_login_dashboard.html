<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RONY FF OFFICIAL</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="loading" class="loading">
  <div class="loader-box">
    <h2>LOADING RONY FF OFFICIAL...</h2>
    <div class="spinner"></div>
    <div style="font-size:10px;color:#707980">SECURE AUTHENTICATION</div>
  </div>
</div>

<section id="loginPage" class="login-page">
  <div class="login-card">
    <img src="photo.jpg" class="logo" alt="RONY FF OFFICIAL">
    <div class="brand">👑 RONY FF OFFICIAL 👑</div>
    <div class="authorize">AUTHORIZE ACCESS</div>

    <form id="loginForm">
      <input id="email" class="input" type="email" placeholder="EMAIL ADDRESS" autocomplete="email" required>
      <input id="password" class="input" type="password" placeholder="PASSWORD" autocomplete="current-password" required>
      <button class="btn" type="submit">LOGIN NOW</button>
    </form>

    <div class="divider">OR JOIN COMMUNITY</div>

    <button id="googleBtn" class="btn google" type="button">
      <span class="google-icon">G</span> SIGN IN WITH GOOGLE
    </button>

    <button id="howBtn" class="btn secondary" type="button">▶ HOW TO BUY AND HOW TO USE</button>

    <div class="links">
      <button id="forgotBtn" class="link" type="button">Forgot Password?</button>
      <span style="color:#555">|</span>
      <button id="signupBtn" class="link" type="button">New User? Create Account</button>
    </div>

    <div id="loginStatus" class="status"></div>
    <div class="footer">© 2026 RONY FF OFFICIAL SYSTEM</div>
  </div>
</section>

<section id="signupPage" class="login-page hidden">
  <div class="login-card">
    <div class="brand">CREATE ACCOUNT</div>
    <div class="authorize">RONY FF OFFICIAL</div>
    <form id="signupForm">
      <input id="username" class="input" placeholder="USERNAME" required>
      <input id="signupEmail" class="input" type="email" placeholder="EMAIL ADDRESS" required>
      <input id="signupPassword" class="input" type="password" placeholder="PASSWORD" required>
      <button class="btn" type="submit">CREATE ACCOUNT</button>
    </form>
    <div id="signupStatus" class="status"></div>
    <button id="backLogin1" class="link" type="button">BACK TO LOGIN</button>
  </div>
</section>

<section id="forgotPage" class="login-page hidden">
  <div class="login-card">
    <div class="brand">RESET PASSWORD</div>
    <div class="authorize">EMAIL RECOVERY</div>
    <input id="resetEmail" class="input" type="email" placeholder="EMAIL ADDRESS">
    <button id="resetBtn" class="btn" type="button">SEND RESET LINK</button>
    <div id="resetStatus" class="status"></div>
    <button id="backLogin2" class="link" type="button">BACK TO LOGIN</button>
  </div>
</section>

<div id="dashboard">
  <header class="topbar">
    <button id="menuBtn" class="menu">☰</button>
    <div class="top-title"><b>RONY FF OFFICIAL</b><small id="userName">SECURE PANEL</small></div>
    <img src="photo.jpg" class="top-logo" alt="">
    <button id="logoutBtn" class="menu">↪</button>
  </header>

  <aside id="sidebar" class="sidebar">
    <div class="side-title">USER PANEL</div>
    <nav class="nav">
      <button data-page="dashboard">🏠 Dashboard</button>
      <button data-page="deposit">💳 Deposit</button>
      <button data-page="products">🛒 Buy Keys</button>
      <button data-page="keys">🔑 My Keys</button>
      <button data-page="history">📜 History</button>
      <button data-page="resellers">👥 My Resellers</button>
      <button data-page="support">🎫 Support Ticket</button>
      <button data-page="refer">🎁 Refer And Earn</button>
      <button data-page="profile">👤 Profile</button>
    </nav>
  </aside>
  <div id="overlay" class="overlay"></div>
  <main id="main" class="main"></main>
</div>

<script>
/*
  IMPORTANT:
  CSS only styles the dashboard.
  JavaScript performs Supabase login and switches Login -> Dashboard.
*/
const SUPABASE_URL = "https://dgknhptbbozshyfiyobo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NEHCtr3Y0o8FctOz5Jm59A_P4GhFAQd";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
let user = null, profile = null;

function loading(on){ $("loading").classList.toggle("hidden", !on); }
function status(id,text,ok=false){ const e=$(id); e.textContent=text; e.className="status "+(ok?"ok":""); }
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}

function showLogin(){
  $("dashboard").style.display="none";
  $("loginPage").classList.remove("hidden");
  $("signupPage").classList.add("hidden");
  $("forgotPage").classList.add("hidden");
}
function showSignup(){
  $("loginPage").classList.add("hidden");
  $("forgotPage").classList.add("hidden");
  $("signupPage").classList.remove("hidden");
}
function showForgot(){
  $("loginPage").classList.add("hidden");
  $("signupPage").classList.add("hidden");
  $("forgotPage").classList.remove("hidden");
}

async function loadProfile(){
  if(!user) return;
  const r=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(r.error) throw r.error;
  if(r.data){profile=r.data;return;}
  const username=user.user_metadata?.username || user.user_metadata?.full_name || user.email.split("@")[0];
  const ins=await db.from("profiles").insert({id:user.id,username,email:user.email}).select("*").single();
  if(ins.error) throw ins.error;
  profile=ins.data;
}

async function enterDashboard(){
  try{
    await loadProfile();
  }catch(e){
    /*
      This is deliberately not a permanent loading screen.
      If Supabase RLS/schema is wrong, the user sees the error.
    */
    loading(false);
    $("loginStatus").textContent="Profile error: "+e.message;
    showLogin();
    return;
  }

  $("loginPage").classList.add("hidden");
  $("signupPage").classList.add("hidden");
  $("forgotPage").classList.add("hidden");
  $("dashboard").style.display="block";
  $("userName").textContent=profile?.username || user.email || "ACCOUNT";
  await openPage("dashboard");
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  status("loginStatus","");
  loading(true);
  try{
    const r=await db.auth.signInWithPassword({
      email:$("email").value.trim(),
      password:$("password").value
    });
    if(r.error) throw r.error;
    user=r.data.user;
    await enterDashboard();
  }catch(e){
    status("loginStatus",e.message);
    showLogin();
  }finally{loading(false);}
});

async function googleLogin(){
  loading(true);
  const redirectTo=window.location.origin+window.location.pathname;
  const r=await db.auth.signInWithOAuth({
    provider:"google",
    options:{
      redirectTo,
      queryParams:{prompt:"select_account"}
    }
  });
  if(r.error){
    loading(false);
    status("loginStatus",r.error.message);
  }
  /*
    Supabase redirects the browser to Google here.
    When Google sends the browser back, INITIAL_SESSION below
    opens the dashboard.
  */
}
$("googleBtn").onclick=googleLogin;

$("signupForm").addEventListener("submit",async e=>{
  e.preventDefault(); loading(true);
  try{
    const r=await db.auth.signUp({
      email:$("signupEmail").value.trim(),
      password:$("signupPassword").value,
      options:{data:{username:$("username").value.trim()}}
    });
    if(r.error) throw r.error;
    if(r.data.session){
      user=r.data.user; await enterDashboard();
    }else{
      status("signupStatus","Account created. Check your email for verification.",true);
      showLogin();
    }
  }catch(e){status("signupStatus",e.message)}
  finally{loading(false)}
});

$("resetBtn").onclick=async()=>{
  const email=$("resetEmail").value.trim();
  if(!email)return status("resetStatus","Enter your email.");
  const r=await db.auth.resetPasswordForEmail(email,{
    redirectTo:window.location.origin+window.location.pathname
  });
  if(r.error)return status("resetStatus",r.error.message);
  status("resetStatus","Reset email sent. Check your inbox.",true);
};

$("signupBtn").onclick=showSignup;
$("forgotBtn").onclick=showForgot;
$("backLogin1").onclick=showLogin;
$("backLogin2").onclick=showLogin;

$("howBtn").onclick=()=>alert(
"1. Login with email or Google.\\n2. Open Dashboard.\\n3. Deposit using the official payment method.\\n4. After verification, buy an available key."
);

$("menuBtn").onclick=()=>{
  $("sidebar").classList.toggle("open");
  $("overlay").classList.toggle("show");
};
$("overlay").onclick=()=>{
  $("sidebar").classList.remove("open");
  $("overlay").classList.remove("show");
};

$("logoutBtn").onclick=async()=>{
  await db.auth.signOut();
  user=null;profile=null;showLogin();
};

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
  openPage(b.dataset.page);
  $("sidebar").classList.remove("open");
  $("overlay").classList.remove("show");
});

async function wallet(){
  if(!user)return null;
  const r=await db.from("wallets").select("*").eq("user_id",user.id).maybeSingle();
  return r.error?null:r.data;
}

async function openPage(page){
  if(page==="dashboard") return dashboardPage();
  if(page==="deposit") return depositPage();
  if(page==="products") return productsPage();
  if(page==="keys") return simpleTable("keys","My Keys","No keys found.");
  if(page==="history") return simpleTable("purchases","History","No purchase history found.");
  if(page==="resellers") return resellerPage();
  if(page==="support") return supportPage();
  if(page==="refer") return referPage();
  if(page==="profile") return profilePage();
}

async function dashboardPage(){
  const w=await wallet(), balance=Number(w?.balance||0);
  $("main").innerHTML=`
    <div class="hero">
      <small>SECURE DASHBOARD</small>
      <h2>Welcome, ${escapeHtml(profile?.username||user?.email)}</h2>
      <p>Authenticated RONY FF OFFICIAL account</p>
      <div class="balance">₹${balance.toFixed(2)}</div>
      <p>Available Wallet Balance</p>
    </div>
    <div class="grid">
      <div class="stat"><span>ACCOUNT</span><b>${profile?.is_reseller?"RESELLER":"USER"}</b></div>
      <div class="stat"><span>WALLET</span><b>₹${balance.toFixed(2)}</b></div>
      <div class="stat"><span>EMAIL</span><b>${escapeHtml(user?.email)}</b></div>
      <div class="stat"><span>STATUS</span><b class="green">ACTIVE</b></div>
    </div>
    <div class="cards">
      <div class="tile"><b>💳 Deposit</b><p>Add balance and submit transaction details.</p><button onclick="openPage('deposit')">OPEN</button></div>
      <div class="tile"><b>🛒 Buy Keys</b><p>See products and available pricing.</p><button onclick="openPage('products')">OPEN</button></div>
      <div class="tile"><b>🔑 My Keys</b><p>View keys assigned to you.</p><button onclick="openPage('keys')">OPEN</button></div>
      <div class="tile"><b>📜 History</b><p>View your purchase records.</p><button onclick="openPage('history')">OPEN</button></div>
    </div>`;
}

async function depositPage(){
  const w=await wallet();
  $("main").innerHTML=`
    <h2 class="page-title">Deposit</h2><div class="page-sub">Submit a deposit request for admin/server verification.</div>
    <div class="box">
      <div class="row"><span>Current Balance</span><b class="cyan">₹${Number(w?.balance||0).toFixed(2)}</b></div>
      <input id="depAmount" class="input" type="number" min="1" placeholder="AMOUNT">
      <input id="depRef" class="input" placeholder="TRANSACTION / PAYMENT ID">
      <select id="depMethod" class="input"><option>UPI</option><option>BINANCE / USDT</option><option>BKASH / NAGAD</option></select>
      <button id="depBtn" class="btn">SUBMIT DEPOSIT REQUEST</button>
      <div id="depStatus" class="status"></div>
    </div>`;
  $("depBtn").onclick=async()=>{
    const amount=Number($("depAmount").value),ref=$("depRef").value.trim(),method=$("depMethod").value;
    if(!amount||amount<=0)return status("depStatus","Enter a valid amount.");
    if(!ref)return status("depStatus","Enter transaction/payment ID.");
    const r=await db.from("deposits").insert({user_id:user.id,amount,method,transaction_id:ref,status:"pending"});
    if(r.error)return status("depStatus",r.error.message);
    status("depStatus","Deposit request submitted for verification.",true);
  };
}

async function productsPage(){
  const r=await db.from("products").select("*");
  let html='<h2 class="page-title">Buy Keys</h2><div class="page-sub">Products loaded from Supabase.</div>';
  if(r.error){$("main").innerHTML=html+`<div class="box"><div class="empty">${escapeHtml(r.error.message)}</div></div>`;return}
  if(!r.data?.length){$("main").innerHTML=html+'<div class="box"><div class="empty">No products available.</div></div>';return}
  for(const p of r.data){
    const price=Number(profile?.is_reseller?(p.reseller_price??p.price??0):(p.user_price??p.price??0));
    html+=`<div class="product"><h3>${escapeHtml(p.name||"Product")}</h3><p>${escapeHtml(p.description||"")}</p><div class="price">₹${price.toFixed(2)}</div><button class="btn" onclick="buy('${escapeHtml(p.id)}')">BUY NOW</button></div>`;
  }
  $("main").innerHTML=html;
}
window.buy=async id=>{
  if(!confirm("Confirm purchase?"))return;
  loading(true);
  try{
    const r=await db.rpc("purchase_product",{p_product_id:id});
    if(r.error)throw r.error;
    alert("Purchase successful.");
    await productsPage();
  }catch(e){alert("Purchase failed: "+e.message)}
  finally{loading(false)}
};

async function simpleTable(table,title,empty){
  const r=await db.from(table).select("*").eq("user_id",user.id);
  $("main").innerHTML=`<h2 class="page-title">${title}</h2><div class="page-sub">Your account records.</div><div class="box"></div>`;
  const box=$("main").querySelector(".box");
  if(r.error){box.innerHTML=`<div class="empty">${escapeHtml(r.error.message)}</div>`;return}
  if(!r.data?.length){box.innerHTML=`<div class="empty">${empty}</div>`;return}
  box.innerHTML=r.data.map(x=>`<div class="row"><span>${escapeHtml(x.product_name||x.product_id||x.key||"Record")}</span><span>${escapeHtml(x.status||x.created_at||"")}</span></div>`).join("");
}

function resellerPage(){
  $("main").innerHTML=`<h2 class="page-title">My Resellers</h2><div class="page-sub">Account role and approval status.</div><div class="box"><div class="row"><span>Role</span><b>${profile?.is_reseller?"RESELLER":"USER"}</b></div><div class="row"><span>Status</span><b class="${profile?.is_reseller?"green":""}">${profile?.is_reseller?"APPROVED":"NOT APPROVED"}</b></div></div>`;
}
function supportPage(){
  $("main").innerHTML=`<h2 class="page-title">Support Ticket</h2><div class="page-sub">Contact support.</div><div class="box"><input id="subject" class="input" placeholder="SUBJECT"><textarea id="message" class="input" style="height:120px;padding-top:12px;text-align:left" placeholder="MESSAGE"></textarea><button id="ticketBtn" class="btn">CREATE TICKET</button><div id="ticketStatus" class="status"></div></div>`;
  $("ticketBtn").onclick=async()=>{
    const r=await db.from("support_tickets").insert({user_id:user.id,subject:$("subject").value.trim(),message:$("message").value.trim(),status:"open"});
    if(r.error)return status("ticketStatus",r.error.message);
    status("ticketStatus","Ticket created.",true);
  };
}
function referPage(){
  const code=profile?.referral_code||user.id.slice(0,8).toUpperCase();
  $("main").innerHTML=`<h2 class="page-title">Refer And Earn</h2><div class="page-sub">Your referral code.</div><div class="box"><div class="row"><span>Referral Code</span><b class="cyan">${escapeHtml(code)}</b></div><button class="btn" onclick="navigator.clipboard.writeText('${escapeHtml(code)}')">COPY CODE</button></div>`;
}
function profilePage(){
  $("main").innerHTML=`<h2 class="page-title">Profile</h2><div class="page-sub">Authenticated account.</div><div class="box"><div class="row"><span>Username</span><span>${escapeHtml(profile?.username)}</span></div><div class="row"><span>Email</span><span>${escapeHtml(user?.email)}</span></div><div class="row"><span>Role</span><span>${profile?.is_reseller?"RESELLER":"USER"}</span></div></div>`;
}

/* OAuth callback: this is what opens Dashboard after Gmail selection. */
db.auth.onAuthStateChange(async(event,session)=>{
  if((event==="INITIAL_SESSION"||event==="SIGNED_IN")&&session?.user){
    user=session.user;
    loading(true);
    await enterDashboard();
    loading(false);
  }
  if(event==="SIGNED_OUT"){
    showLogin();loading(false);
  }
});

/* Initial page load. */
(async()=>{
  loading(true);
  try{
    const r=await db.auth.getSession();
    if(r.error)throw r.error;
    if(r.data.session){
      user=r.data.session.user;
      await enterDashboard();
    }else showLogin();
  }catch(e){
    showLogin();
    status("loginStatus",e.message);
  }finally{loading(false)}
})();
</script>
</body>
</html>
